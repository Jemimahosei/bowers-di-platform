services:
  db:
    image: postgres:16
    environment:
      # Local development only — not a production credential.
      POSTGRES_USER: bowers
      POSTGRES_PASSWORD: bowers_dev
      POSTGRES_DB: bowers_di
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://bowers:bowers_dev@db:5432/bowers_di
    ports:
      - "8000:8000"
    depends_on:
      - db

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
